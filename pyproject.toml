[project]
name = "fable-client"
version = "0.4.0"
description = "HTTP-based client for interacting with the FABLE service for privacy-preserving record linkage with Bloom filters."
authors = [
    {name = "Maximilian Jugl"},
    {name = "Paul Brassel", email = "paul.brassel@medizin.uni-leipzig.de"}
]
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "httpx (>=0.28.0,<0.29.0)",
    "click (>=8.0.0,<9.0.0)",
    "fable-core (>=0.1.5,<0.2.0)",
    "fable-model (>=0.1.7,<0.2.0)",
]
license = "MIT"
keywords = ["record linkage", "privacy", "bloom filter", "bitarray", "cryptography", "service", "client", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]

[project.scripts]
fable = "fable_client.main:run_cli"

[project.optional-dependencies]
faker = [ "faker (>=26.0.0)" ]

[project.urls]
repository = "https://github.com/ul-mds/fable-client"

[tool.poetry]
packages = [{ include = "fable_client" }]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
markers = [
    "integration: mark a test as an integration test."
]
env_files = [
    ".env",
    ".env.test"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.15.0"
pytest = ">=8.3.0"
testcontainers = "^4.9.2"
pytest-dotenv = "^0.5.2"
pytest-cov = "^7.1.0"
pre-commit = "^4.6.0"
readme-coverage-badger = "^1.1.0"
