[project]
name = "fable-client"
version = "0.7.0"
description = "HTTP-based client for interacting with the FABLE services for privacy-preserving record linkage with Bloom filters."
authors = [
    {name = "Maximilian Jugl"},
    {name = "Paul Brassel", email = "paul.brassel@medizin.uni-leipzig.de"}
]
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
    "click (>=8.0.0,<9.0.0)",
    "fable-core (>=0.2.0,<0.3.0)",
    "fable-model (>=0.3.0,<0.4.0)",
    "httpx2 (>=2.9.1,<3.0.0)",
]
license = "MIT"
keywords = ["record linkage", "privacy", "bloom filter", "bitarray", "cryptography", "service", "client", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]

[project.scripts]
fable = "fable_client.main:run_cli"

[project.optional-dependencies]
faker = [ "faker (>=40.0.0)" ]

[project.urls]
repository = "https://github.com/ul-mds/fable-client"

[tool.poetry]
packages = [{ include = "fable_client" }]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
markers = [
    "integration: mark a test as an integration test."
]
env_files = [
    ".env",
    ".env.test"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "testcontainers (>=4.15.0,<5.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-dotenv (>=0.5.2,<0.6.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pre-commit (>=4.6.1,<5.0.0)",
    "readme-coverage-badger (>=1.1.0,<2.0.0)",
    "ruff (>=0.16.0,<0.17.0)"
]
